import com.github.gradle.node.pnpm.task.PnpmInstallTask
import com.github.gradle.node.pnpm.task.PnpmTask

plugins {
    id 'java'
    id 'jacoco'
    id 'maven-publish'
    alias( libs.plugins.enonic.defaults )
    id 'com.enonic.xp.app'
    alias( libs.plugins.node.gradle )
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of( 25 )
    }
}

apply from: "$rootDir/gradle/env.gradle"

repositories {
    mavenLocal()
    mavenCentral()
    xp.enonicRepo( 'dev' )
}

dependencies {
    implementation xplibs.api.core
    implementation xplibs.api.portal

    include xplibs.admin
    include xplibs.auth
    include xplibs.i18n
    include xplibs.io
    include xplibs.node
    include xplibs.portal

    include libs.lib.graphql

    testImplementation "com.enonic.xp:testing:${xpVersion}"
    testImplementation platform( libs.junit.bom )
    testImplementation platform( libs.mockito.bom )
    testImplementation libs.junit.jupiter
    testImplementation libs.mockito.jupiter
    testRuntimeOnly libs.junit.launcher
}

app {
    name = "${group}.${projectName}"
    systemApp = true

    // ! `vp pack` emits es2023, which Nashorn cannot parse.
    scriptEngine = 'GraalJS'
}

// Download and pin the toolchain, so a clean checkout and CI build the same thing.
node {
    download = true
    version = '24.18.0'
    pnpmVersion = '10.33.4' // match packageManager in package.json
}

def ci = System.getenv( 'CI' ) != null

tasks.named( 'pnpmInstall', PnpmInstallTask ) {
    if ( ci ) {
        args.add( '--frozen-lockfile' )
    }
}

// Verification tasks
tasks.register( 'pnpmCheck', PnpmTask ) {
    dependsOn tasks.named( 'pnpmInstall' )
    group = 'verification'
    description = 'Format, lint, typecheck and test the UI and server code.'
    // No inputs/outputs on purpose: a verification task should always run.
    args = ['run', ci ? 'check' : 'check:fix']
}

// Build tasks
tasks.register( 'pnpmBuild', PnpmTask ) {
    dependsOn tasks.named( 'pnpmInstall' ), tasks.named( 'pnpmCheck' )
    // Writes into build/resources/main after processResources has laid the resources down.
    mustRunAfter tasks.named( 'processResources' )
    group = 'build'
    description = 'Build UI resources with Vite.'
    args = ['run', isProd() ? 'build' : 'build:dev']
    environment = ['NODE_ENV': nodeEnvironment()]

    inputs.property 'env', environmentShort()
    inputs.dir 'assets'
    inputs.file 'vite.config.ts'
    inputs.file 'tsconfig.json'
    inputs.file 'package.json'
    outputs.dir layout.buildDirectory.dir( 'resources/main/assets/_static' )
}

tasks.register( 'pnpmPack', PnpmTask ) {
    dependsOn tasks.named( 'pnpmInstall' ), tasks.named( 'pnpmCheck' )
    mustRunAfter tasks.named( 'processResources' )
    group = 'build'
    description = 'Compile server-side TypeScript to per-file CommonJS.'
    args = ['run', 'pack:server']

    inputs.files fileTree( 'src/main/resources' ) {
        include 'extensions/**/*.ts'
        include 'admin/extensions/**/*.ts'
    }
    outputs.dir layout.buildDirectory.dir( 'resources/main/extensions' )
    outputs.cacheIf { false }

    // `vp pack` runs clean:false — it shares this tree with processResources — so without this a
    // deleted .ts keeps shipping its .js. Scoped to the two trees pack emits into: a blanket
    // '**/*.js' would take lib/*.js, which processResources has already copied and will not redo.
    doFirst {
        delete fileTree( layout.buildDirectory.dir( 'resources/main' ) ) {
            include 'extensions/**/*.js'
            include 'admin/extensions/**/*.js'
        }
    }
}

tasks.register( 'yolo' ) {
    description = 'Build without running check or test tasks'

    dependsOn tasks.named( 'deploy' )

    pnpmCheck.enabled = false
    check.enabled = false
    test.enabled = false
    javadoc.enabled = false
}

// Task configurations
tasks.named( 'jar' ).configure {
    if ( isProd() ) {
        exclude 'assets/**/*.map'
    }

    includeEmptyDirs = false

    dependsOn tasks.named( 'pnpmBuild' ), tasks.named( 'pnpmPack' )
}

tasks.named( 'processResources' ).configure {
    // Server sources; pnpmPack emits them as .js into the same tree
    exclude '**/*.ts'
    exclude '**/*.tsx'
    exclude '**/tsconfig.json'

    includeEmptyDirs = false
}

// pnpmBuild and pnpmPack write into build/resources/main, which these read.
tasks.named( 'compileTestJava' ).configure {
    mustRunAfter tasks.named( 'pnpmBuild' ), tasks.named( 'pnpmPack' )
}

tasks.withType( Test ).configureEach {
    // SectionEndpointTest requires the packed `/extensions/section-endpoint` off the classpath.
    dependsOn tasks.named( 'pnpmPack' )
    mustRunAfter tasks.named( 'pnpmBuild' )
}

tasks.named( 'test' ).configure {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
    jvmArgs '-XX:TieredStopAtLevel=1'
}

tasks.named( 'jacocoTestReport' ).configure {
    reports {
        xml.required = true
        html.required = true
    }
    mustRunAfter jar
}

// Lifecycle wiring
tasks.named( 'check' ).configure {
    dependsOn tasks.named( 'pnpmCheck' )
    dependsOn jacocoTestReport
}
